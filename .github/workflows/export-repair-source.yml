name: Export repair source
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-repair-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git archive --format=tar.gz HEAD > /tmp/repair-source.tar.gz
          git rev-parse HEAD > /tmp/repair-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source
          path: |
            /tmp/repair-source.tar.gz
            /tmp/repair-source-sha.txt
          retention-days: 2
