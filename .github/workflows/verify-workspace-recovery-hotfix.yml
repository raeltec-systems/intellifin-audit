name: Verify workspace recovery hotfix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-workspace-recovery-hotfix.yml
      - .github/scripts/workspace-recovery-hotfix.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellifin_ci
          PGDATA: /var/lib/postgresql/data/pgdata
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/intellifin_ci?sslmode=require
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Apply the incident-scoped patch with drift assertions
        run: python3 .github/scripts/workspace-recovery-hotfix.py
      - name: Install pinned tooling
        run: |
          mkdir -p /tmp/workspace-checks
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile > /tmp/workspace-checks/install.log 2>&1 || { tail -80 /tmp/workspace-checks/install.log; exit 1; }
          pnpm exec playwright install --with-deps chromium > /tmp/workspace-checks/browser.log 2>&1 || { tail -80 /tmp/workspace-checks/browser.log; exit 1; }
          pnpm db:migrate > /tmp/workspace-checks/migrate.log 2>&1 || { tail -80 /tmp/workspace-checks/migrate.log; exit 1; }
      - name: Typecheck and boundaries
        run: |
          pnpm typecheck > /tmp/workspace-checks/types.log 2>&1 || { tail -120 /tmp/workspace-checks/types.log; exit 1; }
          pnpm boundaries > /tmp/workspace-checks/boundaries.log 2>&1 || { tail -100 /tmp/workspace-checks/boundaries.log; exit 1; }
      - name: Unit and PostgreSQL integration tests
        run: |
          pnpm test > /tmp/workspace-checks/unit.log 2>&1 || { tail -140 /tmp/workspace-checks/unit.log; exit 1; }
          pnpm test:integration > /tmp/workspace-checks/integration.log 2>&1 || { tail -140 /tmp/workspace-checks/integration.log; exit 1; }
          git diff --check
          grep -E 'Test Files|Tests ' /tmp/workspace-checks/unit.log /tmp/workspace-checks/integration.log
      - name: Retain verified diff
        run: |
          git diff --binary > /tmp/workspace-checks/verified.patch
          git rev-parse HEAD > /tmp/workspace-checks/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-recovery-verification
          path: /tmp/workspace-checks/
          retention-days: 14
  candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: workspace-recovery-verification
          path: /tmp/verified
      - name: Restore precisely the tested patch
        run: |
          test "$(cat /tmp/verified/base.txt)" = "$GITHUB_SHA"
          git apply --check /tmp/verified/verified.patch
          git apply /tmp/verified/verified.patch
          git diff --check
      - name: Publish reviewed Git objects without moving a branch
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const { owner, repo } = context.repo;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (current.data.object.sha !== context.sha) throw new Error('main advanced; do not publish a stale candidate');
            for (const path of ['.github/scripts/workspace-recovery-hotfix.py', '.github/workflows/verify-workspace-recovery-hotfix.yml']) fs.unlinkSync(path);
            cp.execFileSync('git', ['add', '--all']);
            const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
            const tree = [];
            for (const path of paths) {
              if (!fs.existsSync(path)) { tree.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
              const blob = await github.rest.git.createBlob({ owner, repo, content: fs.readFileSync(path).toString('base64'), encoding: 'base64' });
              tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const newTree = await github.rest.git.createTree({ owner, repo, base_tree: parent.data.tree.sha, tree });
            const candidate = await github.rest.git.createCommit({ owner, repo, message: 'fix: seal workspace persistence failures and retain safe diagnostics after cleanup\n\nReconcile ambiguous commits before releasing provider sessions. Persist a failed\nworkspace stage and immutable stop reason. Report closed SQLSTATE codes without\nlogging exception text or provider identities. Unit and real PostgreSQL tests passed.\nHosted Watch/Replay acceptance is still separate.', tree: newTree.data.sha, parents: [context.sha] });
            const receipt = { candidate: candidate.data.sha, base: context.sha, verification_run: context.runId, changed_paths: paths };
            console.log(JSON.stringify(receipt));
            fs.writeFileSync('/tmp/workspace-recovery-receipt.json', JSON.stringify(receipt, null, 2));
            await core.summary.addHeading('Verified workspace recovery').addCodeBlock(JSON.stringify(receipt, null, 2), 'json').write();
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-recovery-receipt
          path: /tmp/workspace-recovery-receipt.json
          retention-days: 14
