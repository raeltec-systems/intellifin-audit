name: Deployed LoanCore acceptance

# Manual by default. The temporary push path below is an explicitly authorized ONE-SHOT
# close-out. Never leave the push trigger in place.
on:
  push:
    branches: [main]
    paths: [.github/workflows/deployed-loancore-acceptance.yml]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type synthetic-loancore to authorize a new synthetic live audit
        required: true
        type: string
      negative_case:
        description: Also run the defective 27-row population and require it to refuse
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: deployed-loancore-acceptance
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prove the trigger commit changed only this workflow
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = '.github/workflows/deployed-loancore-acceptance.yml'
      - name: Archive exact tracked source for the acceptance
        run: |
          git archive --format=tar.gz HEAD > /tmp/acceptance-source.tar.gz
          git rev-parse HEAD > /tmp/acceptance-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-source
          path: |
            /tmp/acceptance-source.tar.gz
            /tmp/acceptance-source-sha.txt
          retention-days: 2
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality gate the decision-hydration repair before deployment
        run: |
          pnpm typecheck
          pnpm boundaries
          pnpm test
      - name: Make the acceptance explicitly observe decision-control hydration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-deployed-loancore.mjs')
          s = p.read_text()
          old = "  await manager.goto(auditor.url(), { waitUntil: 'domcontentloaded' });\n  await confirmed(manager, 'Approve');"
          new = "  await manager.goto(auditor.url(), { waitUntil: 'domcontentloaded' });\n  await expect(manager.locator('[data-version-actions-ready]')).toHaveAttribute('data-version-actions-ready', 'true');\n  await shot(manager, `${prefix}02-manager-review-before-approval`);\n  const managerApprove = manager.getByRole('button', { name: 'Approve', exact: true });\n  emit('manager-approval-ready', { buttons: await managerApprove.count(), ariaDisabled: await managerApprove.getAttribute('aria-disabled') });\n  await confirmed(manager, 'Approve');"
          assert old in s
          p.write_text(s.replace(old, new))
          PY
          node --check scripts/verify-deployed-loancore.mjs
          git diff --check
      - name: Deploy this gated source before acceptance
        if: github.event_name == 'push'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global '@railway/cli@5.47.2'
          railway up --service web --ci
          railway up --service worker --ci
          railway up --service northstar --ci
      - name: Refuse to run against an unhealthy or pre-repair web build
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://web-production-edded.up.railway.app/api/health
          echo
          curl -fsS --max-time 30 https://web-production-edded.up.railway.app/sign-in > /tmp/sign-in.html
          grep -q 'data-signin-ready' /tmp/sign-in.html \
            || { echo 'The deployed build predates the sign-in hydration repair.'; exit 1; }
      - name: Build pinned administrative dependencies and observer browser
        run: |
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Author approve inspect observe conclude and prove the negative case
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIRM_DEPLOYED_AUDIT: ${{ github.event_name == 'push' && 'synthetic-loancore' || inputs.confirm }}
          ACCEPTANCE_NEGATIVE_CASE: ${{ github.event_name == 'push' && 'true' || inputs.negative_case }}
        run: node scripts/verify-deployed-loancore.mjs
      - name: Retain secret-free acceptance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-loancore-acceptance-${{ github.run_id }}
          path: deployed-loancore-evidence/
          if-no-files-found: error
          retention-days: 14
