name: Deployed LoanCore acceptance

# Manual by default. The temporary push path below is an explicitly authorized ONE-SHOT
# close-out: this commit changes only this workflow, deploys the already CI-green PR #43
# application tree, runs both the clean and defective synthetic cases, and is removed after
# evidence is retained. Never leave the push trigger in place.
on:
  push:
    branches: [main]
    paths: [.github/workflows/deployed-loancore-acceptance.yml]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type synthetic-loancore to authorize a new synthetic live audit
        required: true
        type: string
      negative_case:
        description: Also run the defective 27-row population and require it to refuse
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: deployed-loancore-acceptance
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prove the one-shot commit changed no application source
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = '.github/workflows/deployed-loancore-acceptance.yml'
      - name: Archive exact tracked source for the acceptance
        run: |
          git archive --format=tar.gz HEAD > /tmp/acceptance-source.tar.gz
          git rev-parse HEAD > /tmp/acceptance-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-source
          path: |
            /tmp/acceptance-source.tar.gz
            /tmp/acceptance-source-sha.txt
          retention-days: 2
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the harness parses before anything is created
        run: node --check scripts/verify-deployed-loancore.mjs
      - name: Deploy the already verified merged source before acceptance
        if: github.event_name == 'push'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global '@railway/cli@5.47.2'
          railway up --service web --ci
          railway up --service worker --ci
          railway up --service northstar --ci
      - name: Refuse to run against an unhealthy or pre-repair web build
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://web-production-edded.up.railway.app/api/health
          echo
          curl -fsS --max-time 30 https://web-production-edded.up.railway.app/sign-in > /tmp/sign-in.html
          grep -q 'data-signin-ready' /tmp/sign-in.html \
            || { echo 'The deployed build predates the sign-in hydration repair.'; exit 1; }
      - name: Build pinned administrative dependencies and observer browser
        run: |
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Author approve inspect observe conclude and prove the negative case
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIRM_DEPLOYED_AUDIT: ${{ github.event_name == 'push' && 'synthetic-loancore' || inputs.confirm }}
          ACCEPTANCE_NEGATIVE_CASE: ${{ github.event_name == 'push' && 'true' || inputs.negative_case }}
        run: node scripts/verify-deployed-loancore.mjs
      - name: Retain secret-free acceptance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-loancore-acceptance-${{ github.run_id }}
          path: deployed-loancore-evidence/
          if-no-files-found: error
          retention-days: 14
