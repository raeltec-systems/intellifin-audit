name: Deployed LoanCore acceptance

# Manual only. This drives a REAL synthetic audit against the deployed PoC: it creates
# identities and configuration, authors a Procedure through the browser, has a second
# person approve it, and starts a Run on the production worker, Solari and storage.
#
# There is deliberately NO push trigger. One existed and it raced the release: a push to
# main starts this immediately while CI is still running, so Release has not deployed the
# commit yet and the acceptance drives the PREVIOUS build. That is how the 2026-09-17 run
# came to stop at create-procedure against a build without the fix it was testing.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type synthetic-loancore to authorize a new synthetic live audit
        required: true
        type: string
      negative_case:
        description: Also run the defective 27-row population and require it to refuse
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: deployed-loancore-acceptance
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    # The clean Run's observation window is bounded at twenty minutes — a Solari Run
    # drives a remote browser with a model in the loop — and the negative case adds a
    # second authoring journey and a Run that stops at acquisition.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Archive exact tracked source for the active repair workspace
        run: |
          git archive --format=tar.gz HEAD > /tmp/acceptance-source.tar.gz
          git rev-parse HEAD > /tmp/acceptance-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-source
          path: |
            /tmp/acceptance-source.tar.gz
            /tmp/acceptance-source-sha.txt
          retention-days: 2
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the harness parses before anything is created
        run: node --check scripts/verify-deployed-loancore.mjs
      # The last acceptance drove a build that did not carry the fix it was testing and
      # only found out nine steps in. `/sign-in` is public and server-renders the hydration
      # marker, so one request settles whether the deployment is the one under test before
      # any identity or configuration is created.
      - name: Refuse to run against a build without the hydration repair
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://web-production-edded.up.railway.app/api/health
          echo
          curl -fsS --max-time 20 https://web-production-edded.up.railway.app/sign-in > /tmp/sign-in.html
          grep -q 'data-signin-ready' /tmp/sign-in.html \
            || { echo 'The deployed build predates the sign-in hydration repair. Wait for Release.'; exit 1; }
      - name: Build pinned administrative dependencies and observer browser
        run: |
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Author approve inspect and observe the real deployed audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIRM_DEPLOYED_AUDIT: ${{ inputs.confirm }}
          ACCEPTANCE_NEGATIVE_CASE: ${{ inputs.negative_case }}
        run: node scripts/verify-deployed-loancore.mjs
      - name: Retain secret-free acceptance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-loancore-acceptance-${{ github.run_id }}
          path: deployed-loancore-evidence/
          if-no-files-found: error
          retention-days: 14
