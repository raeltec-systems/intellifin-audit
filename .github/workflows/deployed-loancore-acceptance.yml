name: Deployed LoanCore acceptance
# Acceptance against the already deployed release. This workflow never deploys.
on:
  push:
    branches: [validation/final-loancore-20260917]
    paths: [.github/workflows/deployed-loancore-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: deployed-loancore-acceptance-final-v5
  cancel-in-progress: false
env:
  RELEASE_SHA: ef0515efbf0c2c558c5ad0153559d7239a8652d9
jobs:
  live:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove application source equals the deployed release
        run: |
          git diff --exit-code "$RELEASE_SHA" HEAD -- . ':(exclude).github/workflows/**'
          printf 'RELEASE_SHA=%s\nVALIDATION_SHA=%s\nWORKFLOW_RUN=%s\n' "$RELEASE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assemble and inspect the exact acceptance harness
        run: |
          python3 .github/workflows/strict-loancore-patch.py
          node --check strict-loancore-acceptance.mjs
          sha256sum strict-loancore-acceptance.mjs
          # The assembled harness is untracked. No released file was edited.
          git diff --exit-code "$RELEASE_SHA" -- . ':(exclude).github/workflows/**'
          python3 - <<'PY'
          from pathlib import Path
          s=Path('strict-loancore-acceptance.mjs').read_text()
          a=s.index('function hasPredicate'); b=s.index('async function step',a)
          pre="import assert from 'node:assert/strict'; const PERIOD={from:'2026-08-01',to:'2026-08-31'};const SCOPE='test';const report={registrationId:'target'}; const auditor={getByLabel:()=>({inputValue:async()=> '01a0b0e8-2e28-77d3-872b-2bce10020487'})};\n"
          tests="""
          const period=await sectionProof('Period and scope');assert(period({period:{to:PERIOD.to,from:PERIOD.from},scope:SCOPE}));assert(!period({period:null,scope:''}));
          const source=await sectionProof('Population Source binding');const valid={source_snapshot:{bindingId:'01a0b0e8-2e28-77d3-872b-2bce10020487'},inclusion_rule:{all:[{column:'employment_status',kind:'text',operator:'eq',value:'Terminated'},{column:'termination_effective_date',kind:'within-period'}]}};assert(source(valid));assert(!source({...valid,source_snapshot:null}));assert(!source({...valid,source_snapshot:{bindingId:'wrong'}}));assert(!source({...valid,inclusion_rule:{all:[]}}));
          const targets=await sectionProof('Target System selection');assert(targets({targets:[{registrationId:'target',contract:{kind:'web'}}]}));assert(!targets({targets:[]}));assert(!targets({targets:[{registrationId:'wrong',contract:{kind:'web'}}]}));
          console.log('Persistence assertion mutations refused missing/wrong state');
          """
          Path('/tmp/acceptance-assertions.mjs').write_text(pre+s[a:b]+tests)
          PY
          node /tmp/acceptance-assertions.mjs
          cp /tmp/acceptance-assertions.mjs deployed-loancore-evidence/assertion-self-check.mjs
      - name: Check deployed web health
        run: curl -fsS --max-time 30 https://web-production-edded.up.railway.app/api/health
      - name: Build administrative dependencies and install observer browser
        run: |
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Prepare approve run watch and replay through the deployed UI
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIRM_DEPLOYED_AUDIT: synthetic-loancore
          ACCEPTANCE_NEGATIVE_CASE: 'false'
        run: node strict-loancore-acceptance.mjs
      - name: Independently revoke this workflow's temporary identities
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGCONNECT_TIMEOUT: '15'
        run: |
          mkdir -p deployed-loancore-evidence
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -tA \
            -v auditor="acceptance-auditor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test" \
            -v manager="acceptance-audit-manager-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test" \
            -v admin="acceptance-poc-administrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test" <<'SQL' > deployed-loancore-evidence/independent-cleanup.txt
          BEGIN;
          SET LOCAL statement_timeout = '15s';
          DELETE FROM auth_session WHERE user_id IN (SELECT id FROM auth_user WHERE email IN (:'auditor',:'manager',:'admin'));
          DELETE FROM user_role WHERE user_id IN (SELECT id FROM auth_user WHERE email IN (:'auditor',:'manager',:'admin'));
          SELECT jsonb_build_object('userId',id,'sessions',(SELECT count(*) FROM auth_session WHERE user_id=u.id),'roles',(SELECT count(*) FROM user_role WHERE user_id=u.id)) FROM auth_user u WHERE email IN (:'auditor',:'manager',:'admin');
          COMMIT;
          SQL
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=[json.loads(line) for line in Path('deployed-loancore-evidence/independent-cleanup.txt').read_text().splitlines() if line.startswith('{')]
          for row in rows:
              assert row['sessions']==0 and row['roles']==0, 'Temporary identity still has access'
          print(json.dumps({'identityCleanup':rows,'verified':True}))
          PY
      - name: Verify unchanged application and create SHA256 manifest
        if: always()
        run: |
          git diff --exit-code "$RELEASE_SHA" -- . ':(exclude).github/workflows/**'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('deployed-loancore-evidence');out.mkdir(exist_ok=True)
          (out/'provenance.json').write_text(json.dumps({'releaseSha':os.environ['RELEASE_SHA'],'validationSha':os.environ['GITHUB_SHA'],'workflowRunId':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'applicationSourceUnchanged':True},indent=2))
          rows=[{'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted(out.iterdir()) if p.is_file() and p.name!='manifest.json']
          (out/'manifest.json').write_text(json.dumps(rows,indent=2))
          PY
      - name: Retain evidence for visual acceptance and exact blocker review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-loancore-acceptance-${{ github.run_id }}
          path: deployed-loancore-evidence/
          if-no-files-found: error
          retention-days: 14
