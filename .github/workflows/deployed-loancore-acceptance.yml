name: Deployed LoanCore acceptance

# One-shot validation branch workflow against the already released production build.
# This workflow MUST NOT deploy application source.
on:
  push:
    branches: [validation/final-loancore-20260917]
    paths: [.github/workflows/deployed-loancore-acceptance.yml]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type synthetic-loancore to authorize a new synthetic live audit
        required: true
        type: string
      negative_case:
        description: Also run the defective 27-row population and require it to refuse
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: deployed-loancore-acceptance-final-v3
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Prove the trigger commit changed only this workflow
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = '.github/workflows/deployed-loancore-acceptance.yml'
      - name: Prove application source still matches released main
        run: |
          set -euo pipefail
          changed="$(git diff --name-only ef0515efbf0c2c558c5ad0153559d7239a8652d9 HEAD -- . ':(exclude).github/workflows/**')"
          test -z "$changed" || { printf '%s\n' "$changed"; exit 1; }
      - name: Archive exact tracked source for the acceptance
        run: |
          git archive --format=tar.gz HEAD > /tmp/acceptance-source.tar.gz
          git rev-parse HEAD > /tmp/acceptance-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-source
          path: |
            /tmp/acceptance-source.tar.gz
            /tmp/acceptance-source-sha.txt
          retention-days: 2
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch only the validation harness for settled Builder sequencing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-deployed-loancore.mjs')
          s = p.read_text()

          # The procedure worker updates the same version row after every section save.
          # Wait for that pending job to settle, then reload so the Builder adopts the
          # newest optimistic-concurrency token before editing the next section. A failed
          # plan is expected while the draft is incomplete and is NOT an acceptance failure.
          marker = "const STALE = 'That procedure changed since this page was loaded. Reload the page and try again.';\n"
          helper = marker + "async function settleDraftBeforeEdit(page) {\n  const procedureId = new URL(page.url()).pathname.split('/')[2];\n  assert.ok(procedureId);\n  await poll(async () => (await sql`SELECT plan_status FROM procedure_version WHERE procedure_id=${procedureId}::uuid ORDER BY version_number DESC LIMIT 1`)[0] ?? null, row => row !== null && row.plan_status !== 'pending', 90000);\n  await page.reload({ waitUntil: 'domcontentloaded' });\n  await expect(page.locator('[data-guided-ready=true]')).toBeVisible();\n}\nasync function savedSourceSnapshot(procedureId) {\n  return (await sql`SELECT source_snapshot FROM procedure_version WHERE procedure_id=${procedureId}::uuid ORDER BY version_number DESC LIMIT 1`)[0]?.source_snapshot ?? null;\n}\nasync function savePopulationSourceThroughUi(procedureId, sourceName) {\n  for (let attempt = 0; attempt < 3; attempt++) {\n    await settleDraftBeforeEdit(auditor);\n    await openStep(auditor, 'Population Source binding');\n    const select = auditor.getByLabel('Where the records come from');\n    await selectContaining(select, sourceName);\n    const chosen = await select.inputValue();\n    assert.notEqual(chosen, '');\n    await auditor.getByRole('button', { name: 'Save records to test', exact: true }).click();\n    try {\n      const saved = await poll(() => savedSourceSnapshot(procedureId), row => row !== null && row.bindingId === chosen, 20000);\n      emit('population-source-bound-through-ui', { attempt: attempt + 1, bindingId: saved.bindingId });\n      return;\n    } catch {\n      const banners = await auditor.locator('.ls-banner').allInnerTexts().catch(() => []);\n      emit('population-source-save-not-bound', { attempt: attempt + 1, banners: banners.map(text => text.slice(0, 180)) });\n    }\n  }\n  throw new Error('Population Source save did not persist after three settled UI attempts');\n}\n"
          assert marker in s
          s = s.replace(marker, helper, 1)

          old_step = "    await planSettled(auditor); await openStep(auditor, heading); await fill();"
          new_step = "    await settleDraftBeforeEdit(auditor); await openStep(auditor, heading); await fill();"
          assert old_step in s
          s = s.replace(old_step, new_step)

          old_population = "  await step('Population Source binding', () => selectContaining(auditor.getByLabel('Where the records come from'), sourceName),\n    () => auditor.getByRole('button', { name: 'Save records to test', exact: true }).click(), 'Saved. The Draft change is recorded in the audit chain.');"
          new_population = "  phase = `${prefix}Population Source binding`;\n  await savePopulationSourceThroughUi(procedureId, sourceName);"
          assert old_population in s
          s = s.replace(old_population, new_population)

          # Only after every authored section is present do we require an actually
          # successful executable plan.
          old_plan = "toContainText(/Re-derived|Cannot derive:/, { timeout: 150000 })"
          new_plan = "toContainText(/Re-derived/, { timeout: 150000 })"
          assert old_plan in s
          s = s.replace(old_plan, new_plan)

          # A manager's irreversible decision control is inert until hydration.
          old_approve = "  await manager.goto(auditor.url(), { waitUntil: 'domcontentloaded' });\n  await confirmed(manager, 'Approve');"
          new_approve = "  await manager.goto(auditor.url(), { waitUntil: 'domcontentloaded' });\n  await expect(manager.locator('[data-version-actions-ready]')).toHaveAttribute('data-version-actions-ready', 'true');\n  await shot(manager, `${prefix}02-manager-review-before-approval`);\n  const managerApprove = manager.getByRole('button', { name: 'Approve', exact: true });\n  emit('manager-approval-ready', { buttons: await managerApprove.count(), ariaDisabled: await managerApprove.getAttribute('aria-disabled') });\n  await confirmed(manager, 'Approve');"
          assert old_approve in s
          s = s.replace(old_approve, new_approve)

          p.write_text(s)
          PY
          node --check scripts/verify-deployed-loancore.mjs
          git diff --check
      - name: Refuse to run against an unhealthy or pre-repair web build
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://web-production-edded.up.railway.app/api/health
          echo
          curl -fsS --max-time 30 https://web-production-edded.up.railway.app/sign-in > /tmp/sign-in.html
          grep -q 'data-signin-ready' /tmp/sign-in.html \
            || { echo 'The deployed build predates the sign-in hydration repair.'; exit 1; }
      - name: Build pinned administrative dependencies and observer browser
        run: |
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Author approve inspect observe conclude and prove the negative case
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIRM_DEPLOYED_AUDIT: ${{ github.event_name == 'push' && 'synthetic-loancore' || inputs.confirm }}
          ACCEPTANCE_NEGATIVE_CASE: ${{ github.event_name == 'push' && 'true' || inputs.negative_case }}
        run: node scripts/verify-deployed-loancore.mjs
      - name: Retain secret-free acceptance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-loancore-acceptance-${{ github.run_id }}
          path: deployed-loancore-evidence/
          if-no-files-found: error
          retention-days: 14
