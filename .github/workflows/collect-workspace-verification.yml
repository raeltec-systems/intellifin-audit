name: Collect workspace verification receipt
on:
  push:
    branches: [main]
    paths: [.github/workflows/collect-workspace-verification.yml]
permissions:
  actions: read
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve only the prior verification result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' https://api.github.com/repos/raeltec-systems/intellifin-audit/actions/jobs/104981206174/logs --output /tmp/verification.log
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          text = Path('/tmp/verification.log').read_text()
          shas = re.findall(r'VERIFIED_CANDIDATE_SHA=([0-9a-f]{40})', text)
          assert len(set(shas)) == 1, 'Expected one verified candidate'
          result = {'candidate': shas[0], 'base': '763cac329fa0599200568fa0a6c3a91579c0267c', 'verification_run': 35151666534, 'verification_job': 104981206174}
          Path('workspace-verification.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          Path('/tmp/verification.log').unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-verification-receipt
          path: workspace-verification.json
          retention-days: 14
