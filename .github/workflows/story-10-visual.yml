name: Story 10 visual review
on:
  pull_request:
    branches: [main, claude/10-6-legacy-visibility]
    paths:
      - '.github/workflows/story-10-visual.yml'
      - 'tests/e2e/**'
      - 'apps/web/**'
permissions:
  contents: read
concurrency:
  group: story-10-visual-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '11.25.0'
jobs:
  screenshots:
    name: Story 10 screenshot evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: startsWith(github.head_ref, 'claude/10-')
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellifin_e2e
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/intellifin_e2e?sslmode=require
      SERVICE_NAME: web
      BETTER_AUTH_SECRET: ci-e2e-secret-at-least-32-characters-long
      # http, not https: the suite runs `next dev`, where NODE_ENV is development and a
      # plain-http origin is accepted. A production build refuses one, because Better
      # Auth would not mark the session cookie Secure.
      BETTER_AUTH_URL: http://localhost:3000
      E2E_AUDITOR_EMAIL: auditor@example.test
      E2E_ADMIN_EMAIL: administrator@example.test
      E2E_PASSWORD: ci-e2e-password-not-a-real-credential
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The workspace packages export `dist` for runtime, so the dev server and the
      # seed script both need a build first.
      - name: Build workspace packages
        run: pnpm build

      - name: Apply migrations (throwaway CI database)
        run: pnpm db:migrate

      # Better Auth has sign-up disabled, so this script is the only way an account
      # exists at all. Two accounts, two roles: the shell spec needs both.
      - name: Seed the two test accounts
        env:
          SEED_PASSWORD: ${{ env.E2E_PASSWORD }}
        run: |
          pnpm seed:identity --email "$E2E_AUDITOR_EMAIL" --name 'CI Auditor' --role auditor
          pnpm seed:identity --email "$E2E_ADMIN_EMAIL" --name 'CI Administrator' --role poc-administrator

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture changed states through existing browser journeys
        env:
          STORY_VISUAL_CAPTURE: '1'
          STORY_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$STORY_BRANCH" == claude/10-8-* ]]; then
            specs=(live-drop route-boundary flag-run)
          else
            specs=(human-match pause-resume live-view)
            if [[ -f tests/e2e/replay-bounded-history.spec.ts ]]; then specs+=(replay-bounded-history); fi
            if [[ -f tests/e2e/decision-history.spec.ts ]]; then specs+=(decision-history); fi
          fi
          files=()
          for spec in "${specs[@]}"; do files+=("tests/e2e/$spec.spec.ts"); done
          pnpm exec playwright test "${files[@]}" --output=story-visual-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-10-visual-evidence
          path: |
            story-visual-results/**/visual-*.png
            story-visual-results/**/visual-*.json
            story-visual-results/**/error-context.md
          retention-days: 14
          if-no-files-found: error
