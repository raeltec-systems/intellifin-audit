name: Engineering patch delivery

# Temporary, branch-only transport. No deployments or production secrets.
# Remove before release. Exact edits are readable; a stale/ambiguous edit aborts.
on:
  pull_request:
    branches: [main]
    paths: ['.engineering/delivery.json']
permissions:
  contents: write
concurrency:
  group: intellifin-epic-4-delivery
  cancel-in-progress: false
jobs:
  apply:
    if: github.event.pull_request.number == 24 && github.head_ref == 'codex/epic-4-agent-runs' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact edits as atomic commits
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          source = pathlib.Path('.engineering/delivery.json')
          if source.stat().st_size > 2000000: raise RuntimeError('Oversized request')
          request = json.loads(source.read_text())
          base = request['base']
          if not re.fullmatch('[0-9a-f]{40}', base): raise RuntimeError('Invalid baseline')
          git('merge-base', '--is-ancestor', base, 'HEAD')
          transport = {'.engineering/delivery.json', '.github/workflows/engineering-delivery.yml'}
          if set(git('diff', '--name-only', base, 'HEAD').splitlines()) - transport:
              raise RuntimeError('Source changed since the baseline')
          remote = git('ls-remote', 'origin', 'refs/heads/codex/epic-4-agent-runs').split()[0]
          if remote != os.environ['EXPECTED_HEAD']: raise RuntimeError('Branch moved')
          git('config', 'user.name', 'Raeltec Engineering')
          git('config', 'user.email', 'engineering@raeltec.com')
          commits = request['commits']
          if not 1 <= len(commits) <= 12: raise RuntimeError('Invalid batch')
          roots = ('apps/', 'packages/', 'tests/', 'docs/', 'scripts/', '_bmad-output/implementation-artifacts/')
          exact = {'CLAUDE.md', 'vitest.config.ts', 'package.json', 'pnpm-lock.yaml'}
          for item in commits:
              paths = set()
              for edit in item['edits']:
                  name = edit['path']
                  path = pathlib.Path(name)
                  if name not in exact and not name.startswith(roots): raise RuntimeError('Path outside scope')
                  if path.is_absolute() or '..' in path.parts or any(p.startswith('.env') for p in path.parts):
                      raise RuntimeError('Unsafe path')
                  if path.is_symlink() or any(p.is_symlink() for p in path.parents): raise RuntimeError('Symlink path')
                  if 'create' in edit:
                      if path.exists(): raise RuntimeError('File already exists: ' + name)
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_text(edit['create'])
                  else:
                      text = path.read_text()
                      old = edit['old']
                      if not old or text.count(old) != 1: raise RuntimeError('Ambiguous edit: ' + name)
                      path.write_text(text.replace(old, edit['new'], 1))
                  paths.add(name)
              git('add', '--', *sorted(paths))
              git('commit', '-m', item['message'])
              print(git('log', '-1', '--format=%h %s'))
          git('rm', '.engineering/delivery.json')
          git('commit', '-m', 'chore(ci): consume temporary engineering delivery request')
          git('push', 'origin', 'HEAD:refs/heads/codex/epic-4-agent-runs')
          PY
      - name: Preserve committed checkpoint
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/engineering"
          git bundle create "$RUNNER_TEMP/engineering/source.bundle" --all HEAD
          git log -14 --format='%H %s' > "$RUNNER_TEMP/engineering/commits.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-delivered-source
          path: ${{ runner.temp }}/engineering/
          retention-days: 1
          if-no-files-found: error
