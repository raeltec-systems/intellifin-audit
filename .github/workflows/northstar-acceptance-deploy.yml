name: Authorized Northstar acceptance deployment

# Owner authorized this one existing synthetic service on 2026-09-08.
# Operations branch only; remove this workflow after the attempt. Never merge it.
on:
  push:
    branches: [codex/northstar-acceptance-deploy]
    paths: [.github/workflows/northstar-acceptance-deploy.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: northstar-acceptance-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 70497eb8e9e04ae4282f71844fa6363d89d77597
          persist-credentials: false
      - name: Verify exact candidate and its successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 70497eb8e9e04ae4282f71844fa6363d89d77597
          test -z "$(git status --porcelain)"
          node --input-type=module <<'NODE'
          const url = 'https://api.github.com/repos/raeltec-systems/intellifin-audit/actions/runs/34217326851';
          for (let i = 0; i < 30; i++) {
            const response = await fetch(url, { headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' } });
            if (!response.ok) throw new Error('Cannot verify candidate CI.');
            const run = await response.json();
            if (run.head_sha !== '70497eb8e9e04ae4282f71844fa6363d89d77597') throw new Error('CI candidate mismatch.');
            if (run.status === 'completed') {
              if (run.conclusion !== 'success') throw new Error('Candidate CI did not pass.');
              console.log('Verified CI34217326851 on exact candidate70497eb.');
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 20000));
          }
          throw new Error('Candidate CI remains incomplete; no deployment.');
          NODE
      - name: Check existing deployment credential
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: test -n "$RAILWAY_TOKEN"
      - name: Enable pinned pnpm before Node setup
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
      - name: Install repository-pinned Railway CLI
        run: npm install --global @railway/cli@5.47.2
      - name: Upload only Northstar to its existing service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          railway up --project ade2dc6b-9e91-4ecf-bba8-68638389125d
          --environment 1ea4d58f-afab-498f-9dcd-a195e0009026
          --service 1a491862-5633-407b-8032-acd1b14113e0
          --ci --message "Owner-authorized Northstar-only acceptance source70497eb8e9e04ae4282f71844fa6363d89d77597"
      - name: Verify public health and real sign-in surface
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://northstar-production-b312.up.railway.app';
          for (let i = 0; i < 12; i++) {
            const health = await fetch(origin + '/health', { signal: AbortSignal.timeout(10000), redirect: 'error' });
            const login = await fetch(origin + '/loancore', { signal: AbortSignal.timeout(10000), redirect: 'error' });
            const html = await login.text();
            const form = /<form\b[^>]*action=["']\/loancore\/sign-in["'][^>]*>/i.test(html)
              && /<input\b[^>]*type=["']password["']/i.test(html)
              && /method=["']post["']/i.test(html);
            if (health.ok && login.ok && form) {
              console.log(JSON.stringify({ source: '70497eb8e9e04ae4282f71844fa6363d89d77597', health: health.status, login: login.status, realSignInForm: true }));
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Updated public health/sign-in surface not confirmed.');
          NODE
