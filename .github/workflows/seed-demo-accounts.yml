# Seed the three demo accounts into the deployed environment. MANUAL ONLY.
#
# THREE, not two, and the third is not a convenience. FR-2 gives version approval to an
# Audit Manager alone, and denies it to the person who authored the version -- so an
# auditor and an administrator between them cannot get a Procedure Version approved at
# all, and the create -> approve -> run journey stops dead one step in. The Audit
# Manager is what makes that journey walkable.
#
# This exists because there is no other way to create a user: Better Auth has
# `disableSignUp: true`, so the running application has no sign-up endpoint at all, and
# `scripts/seed-identity.mts` is the single administrative path.
#
# READ THIS BEFORE KEEPING IT. This workflow can mint a PoC Administrator, and it prints
# the password into the run summary, where anybody with read access to Actions can see
# it. That is acceptable for a PoC whose data is synthetic by construction and whose
# accounts are throwaway. It is NOT acceptable once anything real is behind these
# accounts. Delete this file when the demo is over, or move the password to a repository
# secret and stop printing it.
#
# It never resets an existing password: `seed-identity` leaves a known address alone and
# only re-asserts the role. Re-running it does not lock anybody out, and it also does not
# recover a lost password — delete the row and re-run for that.

name: Seed demo accounts

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "seed" to confirm creating demo accounts in production'
        required: true
        type: string

concurrency: seed-demo-accounts

jobs:
  seed:
    name: Seed demo accounts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse unless explicitly confirmed
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "seed" || {
            echo 'Refusing: type "seed" to confirm.'
            exit 1
          }

      - uses: actions/checkout@v5

      - name: Enable corepack and pin pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `seed-identity` runs under plain node and imports the packages' built output.
      - run: pnpm build

      - name: Fail fast when the DATABASE_URL secret is missing
        run: test -n "${{ secrets.DATABASE_URL }}" || { echo 'DATABASE_URL is not set'; exit 1; }

      - name: Create the accounts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Generated per run, NOT the deployment's real secret, and that is safe: this
          # secret signs session cookies and plays no part in how a password is stored.
          # Proven rather than assumed — an account seeded under one secret signs in
          # against an application running a different one (verified end to end before
          # this was written). The first version of this workflow read
          # `secrets.BETTER_AUTH_SECRET`, which does not exist in this repository, so
          # `seed-identity` refused in two seconds with "BETTER_AUTH_SECRET is required".
          BETTER_AUTH_SECRET: ${{ github.run_id }}-seeding-only-not-the-deployment-secret
          # Only needs to be a valid https origin. Nothing here signs in, and the host
          # is never resolved.
          BETTER_AUTH_URL: https://seed.invalid
        run: |
          set -euo pipefail
          # Generated here rather than typed anywhere: a password in an input box is a
          # password in the workflow's parameters for ever.
          PASSWORD="Demo-$(openssl rand -hex 6)"
          export SEED_PASSWORD="$PASSWORD"

          # `seed-identity` says which of the two things it did, and the difference is
          # the whole point of the summary: an address that already existed kept its OLD
          # password, so printing the new one beside it would hand somebody a credential
          # that does not work and no way to tell. Row by row, honestly.
          rows=''
          seed() {
            local email="$1" name="$2" role="$3" label="$4" out
            out="$(pnpm seed:identity --email "$email" --name "$name" --role "$role")"
            echo "$out"
            if grep -q '^created user ' <<<"$out"; then
              rows="${rows}| ${label} | ${email} | \`${PASSWORD}\` | created now |"$'\n'
            else
              rows="${rows}| ${label} | ${email} | *(unchanged — set when it was created)* | already existed |"$'\n'
            fi
          }

          seed administrator@example.test 'Demo PoC Administrator' poc-administrator 'PoC Administrator'
          seed auditor@example.test       'Demo Auditor'           auditor           'Auditor'
          seed manager@example.test       'Demo Audit Manager'     audit-manager     'Audit Manager'

          {
            echo '## Demo accounts'
            echo
            echo 'Throwaway credentials for walking the PoC. Change or delete them after.'
            echo
            echo '| Role | Email | Password | This run |'
            echo '|---|---|---|---|'
            printf '%s' "$rows"
            echo
            echo 'The Auditor authors and submits a Procedure Version and starts Runs; the'
            echo 'Audit Manager approves it (FR-2 denies approval to the version'"'"'s own'
            echo 'author, so one account cannot do both); the PoC Administrator registers'
            echo 'Target Systems and Population Sources and manages users, and may author'
            echo 'nothing.'
            echo
            echo 'A password is NEVER reset. An account marked "already existed" keeps the'
            echo 'password it was created with — recover it from the run that created it,'
            echo 'or delete the row and re-run this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
