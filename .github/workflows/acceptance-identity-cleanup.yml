name: Acceptance identity cleanup

# Revokes the temporary identities left behind by acceptance runs that were CANCELLED
# before their own `finally` could run. A cancelled node process is sent SIGTERM mid-step,
# so its session-revocation block never executes and a working credential for a seeded
# account stays live. This removes the session rows and the role grant; the accounts and
# every authored artefact they produced are left exactly as they are, because deleting
# audit history to tidy an environment is the one thing this must not do.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type revoke-acceptance-identities to authorize
        required: true
        type: string
      keep_run_id:
        description: GITHUB_RUN_ID of an acceptance run still in flight, whose identities must be left alone
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: acceptance-identity-cleanup
jobs:
  revoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@intellifin/infrastructure...' build
      - name: Revoke stale acceptance identities
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIRM: ${{ inputs.confirm }}
          KEEP_RUN_ID: ${{ inputs.keep_run_id }}
        run: |
          set -euo pipefail
          # Inputs cross as quoted environment variables. `${{ }}` is substituted by GitHub
          # BEFORE bash parses this script, so an input spelled inline would be program text.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createSqlClient } from '@intellifin/infrastructure';
          assert.equal(process.env.CONFIRM, 'revoke-acceptance-identities', 'Explicit cleanup confirmation required.');
          const keep = (process.env.KEEP_RUN_ID ?? '').trim();
          const sql = createSqlClient(process.env.DATABASE_URL, { max: 1 });
          try {
            // Only the harness's own synthetic addresses, and only the ones whose run is over.
            const candidates = await sql`
              SELECT u.id, u.email
              FROM auth_user u
              WHERE u.email LIKE 'acceptance-%@example.test'
                 OR u.email LIKE 'source-save-diagnostic-%@example.test'
              ORDER BY u.email`;
            const stale = candidates.filter(row => keep === '' || !String(row.email).includes(`-${keep}-`));
            const report = [];
            for (const account of stale) {
              const result = await sql.begin(async tx => {
                const sessions = await tx`DELETE FROM auth_session WHERE user_id=${account.id} RETURNING id`;
                const roles = await tx`DELETE FROM user_role WHERE user_id=${account.id} RETURNING role`;
                return { sessions: sessions.length, roles: roles.map(r => r.role) };
              });
              report.push({ email: account.email, ...result });
            }
            console.log('CLEANUP', JSON.stringify({ considered: candidates.length, revoked: report.length, keptRunId: keep || null, report }, null, 2));
            const remaining = await sql`
              SELECT count(*)::int AS sessions FROM auth_session s
              JOIN auth_user u ON u.id = s.user_id
              WHERE u.email LIKE 'acceptance-%@example.test'`;
            console.log('REMAINING_ACCEPTANCE_SESSIONS', remaining[0].sessions);
          } finally { await sql.end({ timeout: 5 }); }
          NODE
