name: Verify workspace storage hotfix

# One-off incident verification. This runner has no deployment credentials and never
# updates a branch. It publishes a verified, unreferenced Git commit for review; the
# owner-authorized connector advances main separately, through the normal release gate.
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-workspace-storage-hotfix.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellifin_ci
          PGDATA: /var/lib/postgresql/data/pgdata
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/intellifin_ci?sslmode=require
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
      - name: Install the repository's pinned tooling
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm db:migrate
      - name: Add regression against the real repository and PostgreSQL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/integration/agent-workspace.test.ts')
          old = "  it('provisions one workspace, bound to the Run, and records it on the Timeline', async () => {"
          assert p.read_text().count(old) == 1
          new = '''  // Provider identities are opaque, not UUIDs. The production Solari identity
            // exceeded the old 200-character CHECK after the browser had already opened.
            it.each([201, 768, 4096])('persists a full opaque provider identity of %i characters through reattach and release', async (length) => {
              const job = await seed('web');
              const workspaceId = 'A'.repeat(length - 2) + '_-';
              const ref: WorkspaceRef = { runId: job.runId, workspaceId, mode: 'solari' };
              const handle: WorkspaceHandle = { ref, expiresAt: new Date(Date.now() + 3_600_000).toISOString(), takeDenials: () => [], denied: () => 0 };
              let creates = 0;
              let released = false;
              const execution: BrowserExecution = {
                mode: 'solari',
                create: async () => { creates += 1; return handle; },
                attach: async (requested) => { expect(requested).toEqual(ref); return handle; },
                release: async (requested) => { expect(requested).toEqual(ref); released = true; },
                downloadRecording: async () => null,
                perform: async () => { throw new BrowserActionError('unavailable'); },
              };
              expect(await provisionWorkspace(deps(execution), job)).toEqual({ retry: false, provisioned: true, deferred: false });
              expect(await row(job.runId)).toMatchObject({ status: 'OPEN', mode: 'solari', workspace_id: workspaceId, attempts: 1 });
              expect(await provisionWorkspace(deps(execution), job)).toMatchObject({ provisioned: true });
              expect(creates).toBe(1);
              expect(await row(job.runId)).toMatchObject({ workspace_id: workspaceId, attempts: 1 });
              await terminate(job.runId, 'RUN_FAILED');
              expect(await releaseWorkspace(deps(execution), job.runId)).toEqual({ released: true });
              expect(released).toBe(true);
              expect(await row(job.runId)).toMatchObject({ status: 'RELEASED', workspace_id: workspaceId });
            });

          '''
          p.write_text(p.read_text().replace(old, new + old))
          PY
      - name: Prove the regression fails on generation 49 for the expected constraint
        run: |
          set +e
          pnpm test:integration tests/integration/agent-workspace.test.ts -t 'persists a full opaque provider identity' > /tmp/workspace-red.log 2>&1
          status=$?
          set -e
          cat /tmp/workspace-red.log
          test "$status" -ne 0
          grep -q 'run_workspace_identity_shape' /tmp/workspace-red.log
      - name: Apply the bounded forward schema repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/infrastructure/src/db/schema.ts')
          old = "check('run_workspace_identity_shape',sql`${t.workspaceId} IS NULL OR (length(${t.workspaceId}) BETWEEN 1 AND 200)`),"
          assert p.read_text().count(old) == 1
          new = "// Opaque provider identity, not a UUID: Solari identifiers can exceed 200 characters.\n  // Keep the complete identity for reattach/release, with a bounded storage budget.\n  check('run_workspace_identity_shape',sql`${t.workspaceId} IS NULL OR (length(${t.workspaceId}) BETWEEN 1 AND 4096)`),"
          p.write_text(p.read_text().replace(old, new))
          p = Path('packages/infrastructure/src/db/compat.ts')
          text = p.read_text()
          for key in ['SUPPORTED_SCHEMA_MIN', 'SUPPORTED_SCHEMA_MAX']:
              old = f'export const {key} = 49;'
              assert text.count(old) == 1
              text = text.replace(old, f'export const {key} = 50;')
          p.write_text(text)
          PY
          pnpm db:generate < /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json
          folder = Path('packages/infrastructure/drizzle')
          journal = json.loads((folder / 'meta/_journal.json').read_text())
          entry = journal['entries'][-1]
          assert entry['idx'] == 50
          migration = folder / (entry['tag'] + '.sql')
          text = migration.read_text()
          assert 'run_workspace_identity_shape' in text and '4096' in text
          assert 'DROP TABLE' not in text and 'DROP COLUMN' not in text
          migration.write_text(text + '\n--> statement-breakpoint\nINSERT INTO "schema_meta" ("version") VALUES (50);\n')
          p = Path('CLAUDE.md')
          p.write_text('''## 2026-09-16 — Solari workspace identities are opaque, not short IDs

          Production Run 01a0abec-17dc-735c-a924-8cd077f31da9 reached the OPEN
          checkpoint, but PostgreSQL rejected it with run_workspace_identity_shape.
          The original CHECK capped provider identities at 200 characters. Solari had
          already returned a browser; this was a persistence failure, not proof of a
          provider outage. Generation 50 expands the bounded storage budget to 4096
          characters without truncating, hashing or rewriting the identity. The full
          value is needed to reattach and release the same session. Historical migrations
          are unchanged. The PostgreSQL regression covers 201, 768 and 4096-character
          synthetic identities through provision, reattach and terminal release.

          Never put real provider identities, protocol URLs, database parameters or
          exception messages into incident reports. Failed checkpoint persistence must
          also have a named failure path and safe cleanup; the schema repair alone does
          not prove live viewing, replay or an end-to-end audit execution.

          ''' + p.read_text())
          PY
          pnpm db:migrate
      - name: Verify types, boundaries, unit tests and integration tests
        run: |
          pnpm typecheck
          pnpm boundaries
          pnpm test
          pnpm test:integration
          git diff --check
      - name: Confirm schema generation is stable
        run: |
          git add packages/infrastructure/drizzle
          pnpm db:generate < /dev/null
          git diff --exit-code -- packages/infrastructure/drizzle
      - name: Publish verified candidate Git objects, without moving main
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const { owner, repo } = context.repo;
            const base = context.sha;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (current.data.object.sha !== base) throw new Error('main advanced; refusing a stale candidate');
            // Remove the one-off runner from the candidate, not from the running job.
            fs.unlinkSync('.github/workflows/verify-workspace-storage-hotfix.yml');
            cp.execFileSync('git', ['add', '--all']);
            const paths = cp.execFileSync('git', ['diff', '--cached', '--name-only', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
            const tree = [];
            for (const path of paths) {
              if (!fs.existsSync(path)) { tree.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
              const blob = await github.rest.git.createBlob({ owner, repo, content: fs.readFileSync(path).toString('base64'), encoding: 'base64' });
              tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: base });
            const createdTree = await github.rest.git.createTree({ owner, repo, base_tree: parent.data.tree.sha, tree });
            const commit = await github.rest.git.createCommit({ owner, repo, message: 'fix: persist full Solari workspace identities with PostgreSQL regression coverage\n\nExpand the bounded identity CHECK through a forward generation-50 migration.\nProven red on generation 49; typecheck, boundaries, unit and integration tests passed.\nNo production secrets or live services were used by this verification runner.', tree: createdTree.data.sha, parents: [base] });
            core.notice(`VERIFIED_CANDIDATE_SHA=${commit.data.sha}`);
            core.notice(`BASE_SHA=${base}`);
            core.notice(`CHANGED_PATHS=${paths.join(',')}`);
            await core.summary.addHeading('Verified workspace storage candidate').addRaw(`Candidate: ${commit.data.sha}\n\nParent: ${base}\n\nNo branch ref was changed. Normal main CI/release must run after publication.\n`).write();
