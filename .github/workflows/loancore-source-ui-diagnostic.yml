name: LoanCore source UI diagnostic

on:
  push:
    branches: [validation/final-loancore-20260917]
    paths: [.github/workflows/loancore-source-ui-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: loancore-source-ui-diagnostic
  cancel-in-progress: false

env:
  RELEASE_SHA: ef0515efbf0c2c558c5ad0153559d7239a8652d9

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove application source is the released source
        run: |
          git diff --exit-code "$RELEASE_SHA" HEAD -- . ':(exclude).github/workflows/**'
          echo "APPLICATION_SOURCE_MATCH=$RELEASE_SHA"
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Assemble the exact diagnostic harness with observed selector corrections
        run: |
          # Reuse the immutable diagnostic, not application source. Archive the exact
          # executed harness so this transformation cannot disappear from the evidence.
          git show 18e2959e425f949e3e425f2702a9e68651aa129e:.github/workflows/loancore-source-ui-diagnostic.yml > /tmp/source-diagnostic-definition.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          definition = Path('/tmp/source-diagnostic-definition.yml').read_text()
          script = textwrap.dedent(definition.split("node --input-type=module <<'NODE'\n", 1)[1].split('\n          NODE', 1)[0])
          replacements = {
              'SELECT id, period, scope, source_snapshot, targets, plan_status': 'SELECT version_id AS id, period, scope, source_snapshot, targets, plan_status',
              "scopePanel.getByRole('button',{name:'Choose dates',exact:true})": '''scopePanel.locator('.ls-guide-questions__nav button[aria-controls$="-period"]')''',
              "panel.getByRole('button',{name:'Choose records',exact:true})": '''panel.locator('.ls-guide-questions__nav button[aria-controls$="-source"]')''',
          }
          for before, after in replacements.items():
              assert script.count(before) == 1, f'Diagnostic replacement did not match exactly once: {before}'
              script = script.replace(before, after, 1)
          Path('source-save-diagnostic.mjs').write_text(script)
          out = Path('/tmp/source-save-proof'); out.mkdir(exist_ok=True)
          (out / 'executed-harness.mjs').write_text(script)
          PY
          node --check source-save-diagnostic.mjs
          sha256sum source-save-diagnostic.mjs
      - name: Reproduce source save through visible UI and verify persistence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node source-save-diagnostic.mjs
      - name: Recheck source invariance
        if: always()
        run: git diff --exit-code "$RELEASE_SHA" -- . ':(exclude).github/workflows/**'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-save-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/source-save-proof/
          if-no-files-found: error
          retention-days: 7
