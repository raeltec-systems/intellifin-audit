name: LoanCore source UI diagnostic

on:
  push:
    branches: [validation/final-loancore-20260917]
    paths: [.github/workflows/loancore-source-ui-diagnostic.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Inspect selected-source client state without saving
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { chromium, expect } from '@playwright/test';
          import { createSqlClient, createDb, findUserIdByEmail } from '@intellifin/infrastructure';
          const BASE = 'https://web-production-edded.up.railway.app';
          const procedureId = '01a0b0e8-4214-7621-bd5e-e3b6822d83bc';
          const sourceName = 'Live acceptance leavers 35266786707-1';
          const email = `source-ui-diagnostic-${process.env.GITHUB_RUN_ID}@example.test`;
          const password = `Diagnostic-${randomBytes(32).toString('hex')}`;
          console.log(`::add-mask::${password}`);
          const sql = createSqlClient(process.env.DATABASE_URL, { max: 1 });
          const db = createDb(sql);
          let browser;
          let userId;
          try {
            execFileSync(process.execPath, ['scripts/seed-identity.mts', '--email', email, '--name', 'Source UI Diagnostic Auditor', '--role', 'auditor', '--create-only', 'true'], {
              env: { ...process.env, SEED_PASSWORD: password, BETTER_AUTH_SECRET: randomBytes(32).toString('hex'), BETTER_AUTH_URL: 'https://seed.invalid' },
              stdio: 'pipe', timeout: 60000,
            });
            userId = await findUserIdByEmail(db, email);
            browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.setDefaultTimeout(40000);
            await page.goto(`${BASE}/sign-in`, { waitUntil: 'domcontentloaded' });
            await expect(page.locator('[data-signin-ready]')).toHaveAttribute('data-signin-ready', 'true');
            await page.getByLabel('Email address').fill(email);
            await page.getByLabel('Password').fill(password);
            await page.getByRole('button', { name: 'Sign in', exact: true }).click();
            await page.waitForURL(url => url.origin === BASE && !url.pathname.includes('sign-in'));
            await page.goto(`${BASE}/procedures/${procedureId}/builder`, { waitUntil: 'domcontentloaded' });
            await expect(page.locator('[data-guided-ready=true]')).toBeVisible();
            await page.locator('[data-preparation-nav="evidence"]').click();
            const panel = page.locator('[data-preparation-panel="evidence"]');
            await expect(panel).toBeVisible();
            const sourceQuestion = panel.locator('.ls-guide-questions__nav button[aria-controls$="-source"]');
            if (await sourceQuestion.count()) await sourceQuestion.click();
            const select = page.getByLabel('Where the records come from');
            const options = await select.locator('option').evaluateAll(nodes => nodes.map(n => ({ label: n.textContent ?? '', value: n.value })));
            const matches = options.filter(o => o.value && o.label.includes(sourceName));
            if (matches.length !== 1) throw new Error(`Expected one source option, got ${matches.length}`);
            await select.selectOption(matches[0].value);
            await page.waitForTimeout(750);
            const bindingError = page.locator('[id$="-binding-error"]');
            const save = page.getByRole('button', { name: 'Save records to test', exact: true });
            const result = {
              selectedValue: await select.inputValue(),
              selectedLabel: await select.locator('option:checked').textContent(),
              bindingError: (await bindingError.innerText()).trim(),
              bindingErrorHtml: (await bindingError.innerHTML()).slice(0, 1000),
              saveCount: await save.count(),
              saveAriaDisabled: await save.getAttribute('aria-disabled'),
              saveDisabled: await save.isDisabled(),
            };
            console.log('SOURCE_UI_DIAGNOSTIC', JSON.stringify(result));
            await page.screenshot({ path: '/tmp/source-ui.png', fullPage: false });
          } finally {
            await browser?.close().catch(() => {});
            if (userId) {
              await sql.begin(async tx => {
                await tx`DELETE FROM auth_session WHERE user_id=${userId}`;
                await tx`DELETE FROM user_role WHERE user_id=${userId}`;
              });
            }
            await sql.end({ timeout: 5 }).catch(() => {});
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-ui-diagnostic-${{ github.run_id }}
          path: /tmp/source-ui.png
          if-no-files-found: ignore
          retention-days: 2
