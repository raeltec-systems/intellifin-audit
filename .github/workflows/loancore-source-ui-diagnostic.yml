name: LoanCore source UI diagnostic

on:
  push:
    branches: [validation/final-loancore-20260917]
    paths: [.github/workflows/loancore-source-ui-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: loancore-source-ui-diagnostic
  cancel-in-progress: false

env:
  RELEASE_SHA: ef0515efbf0c2c558c5ad0153559d7239a8652d9

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove application source is the released source
        run: |
          git diff --exit-code "$RELEASE_SHA" HEAD -- . ':(exclude).github/workflows/**'
          echo "APPLICATION_SOURCE_MATCH=$RELEASE_SHA"
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Reproduce source save through visible UI and verify persistence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { randomBytes, createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, writeFileSync, readFileSync, readdirSync } from 'node:fs';
          import { setTimeout as delay } from 'node:timers/promises';
          import { chromium, expect } from '@playwright/test';
          import { createSqlClient, createDb, findUserIdByEmail } from '@intellifin/infrastructure';
          const BASE = 'https://web-production-edded.up.railway.app';
          const sourceName = 'Live acceptance leavers 35266786707-1';
          const bindingId = '01a0b0e8-2e28-77d3-872b-2bce10020487';
          const suffix = `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const email = `source-save-diagnostic-${suffix}@example.test`;
          const password = `Diagnostic-${randomBytes(32).toString('hex')}`;
          const authSecret = randomBytes(32).toString('hex');
          console.log(`::add-mask::${password}`);
          console.log(`::add-mask::${authSecret}`);
          const out = '/tmp/source-save-proof'; mkdirSync(out, { recursive: true });
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const redact = value => String(value).split(password).join('[REDACTED]').split(authSecret).join('[REDACTED]').split(process.env.DATABASE_URL).join('[REDACTED]');
          const report = { accepted: false, purpose: 'isolated authoring diagnostic; not end-to-end acceptance', releasedApplicationSha: process.env.RELEASE_SHA, validationSha: process.env.GITHUB_SHA, workflowRunId: process.env.GITHUB_RUN_ID, workflowAttempt: process.env.GITHUB_RUN_ATTEMPT, startedAt: new Date().toISOString(), expectedBindingId: bindingId, stages: [], posts: [], cleanup: null };
          const stage = name => { report.stage = name; report.stages.push({ name, at: new Date().toISOString() }); console.log('DIAGNOSTIC_STAGE', name); };
          const sql = createSqlClient(process.env.DATABASE_URL, { max: 1 });
          const db = createDb(sql);
          let browser, page, userId, procedureId;
          const poll = async (read, accept, description, ms=30000) => { const end=Date.now()+ms; do { const value=await read(); if(accept(value)) return value; await delay(500); } while(Date.now()<end); throw new Error(`Timed out: ${description}`); };
          const version = async () => (await sql`SELECT id, period, scope, source_snapshot, targets, plan_status FROM procedure_version WHERE procedure_id=${procedureId}::uuid ORDER BY version_number DESC LIMIT 1`)[0];
          const safeVersion = row => row && ({ versionId: row.id, period: row.period, scope: row.scope, hasSourceSnapshot: row.source_snapshot !== null, sourceBindingId: row.source_snapshot?.bindingId ?? null, sourceSnapshotSha256: sha(JSON.stringify(row.source_snapshot)), targets: row.targets, planStatus: row.plan_status });
          const screenshot = async name => { if(!page || !new URL(page.url()).pathname.includes('/builder')) return; const html=await page.content(); assert(!html.includes(password) && !html.includes(authSecret), 'Secret detected; refusing screenshot'); await page.screenshot({ path: `${out}/${name}.png`, fullPage: false }); };
          try {
            stage('create-temporary-identity');
            execFileSync(process.execPath, ['scripts/seed-identity.mts', '--email', email, '--name', 'Source Save Diagnostic Auditor', '--role', 'auditor', '--create-only', 'true'], {
              env: { ...process.env, SEED_PASSWORD: password, BETTER_AUTH_SECRET: authSecret, BETTER_AUTH_URL: 'https://seed.invalid' }, stdio: 'pipe', timeout: 60000,
            });
            userId = await findUserIdByEmail(db, email); assert(userId, 'Temporary identity was not found');
            report.auditorId = userId;
            browser = await chromium.launch({ headless: true });
            page = await browser.newPage({ viewport: { width: 1440, height: 1000 } }); page.setDefaultTimeout(30000);
            page.on('request', request => { const url=new URL(request.url()); if(request.method()==='POST' && url.origin===BASE && url.pathname.startsWith('/procedures/')) report.posts.push({ path: url.pathname, at: new Date().toISOString() }); });
            stage('sign-in');
            await page.goto(`${BASE}/sign-in`, { waitUntil: 'domcontentloaded' });
            await expect(page.locator('[data-signin-ready]')).toHaveAttribute('data-signin-ready','true');
            await page.getByLabel('Email address').fill(email); await page.getByLabel('Password').fill(password); await page.getByRole('button',{name:'Sign in',exact:true}).click();
            await page.waitForURL(url => url.origin===BASE && !url.pathname.includes('sign-in'));
            stage('create-procedure');
            await page.goto(`${BASE}/procedures/new`, { waitUntil:'domcontentloaded' });
            await expect(page.locator('[data-new-procedure-ready]')).toHaveAttribute('data-new-procedure-ready','true');
            await page.getByLabel('Template').selectOption('P-1'); await page.getByLabel('Control name',{exact:true}).fill(`Source save diagnostic ${suffix}`);
            await page.getByRole('button',{name:'Create Procedure',exact:true}).click(); await expect(page.getByRole('dialog')).toBeVisible(); await page.getByRole('dialog').getByRole('button',{name:'Create Procedure',exact:true}).click();
            await page.waitForURL(/\/procedures\/[0-9a-f-]+\/builder/); procedureId=new URL(page.url()).pathname.split('/')[2]; report.procedureId=procedureId;
            await expect(page.locator('[data-guided-ready=true]')).toBeVisible(); await screenshot('01-created');
            stage('period-scope');
            await page.locator('[data-preparation-nav="scope"]').click();
            const scopePanel=page.locator('[data-preparation-panel="scope"]'); await expect(scopePanel).toBeVisible();
            await scopePanel.getByRole('button',{name:'Choose dates',exact:true}).click();
            await expect(page.getByLabel('Period start',{exact:true})).toBeVisible();
            await page.getByLabel('Period start',{exact:true}).fill('2026-08-01'); await page.getByLabel('Period end',{exact:true}).fill('2026-08-31');
            const disclosure=scopePanel.locator('details[data-guided-manual="scope"]'); if(!(await disclosure.getAttribute('open')!==null)) await disclosure.locator('summary').click();
            const scope='The three canonical synthetic leavers in the separately declared August 2026 acceptance export, checked in LoanCore only.';
            await page.getByLabel('Scope statement').fill(scope);
            await page.getByRole('button',{name:'Save Period and scope',exact:true}).click();
            const periodSaved=await poll(version, row=>row?.scope===scope && row.period?.from==='2026-08-01' && row.period?.to==='2026-08-31' && row.plan_status!=='pending', 'persisted period/scope and settled derivation');
            report.periodSaved=safeVersion(periodSaved);
            await page.reload({waitUntil:'domcontentloaded'}); await expect(page.locator('[data-guided-ready=true]')).toBeVisible();
            stage('select-source');
            await page.locator('[data-preparation-nav="evidence"]').click(); const panel=page.locator('[data-preparation-panel="evidence"]'); await expect(panel).toBeVisible();
            await panel.getByRole('button',{name:'Choose records',exact:true}).click();
            const select=page.getByLabel('Where the records come from'); await expect(select).toBeVisible();
            await select.selectOption(bindingId); await expect(select).toHaveValue(bindingId);
            const selectedLabel=await select.locator('option:checked').textContent(); assert(selectedLabel.includes(sourceName),'Source label did not match the pinned binding');
            const error=page.locator('[id$="-binding-error"]'); await expect(error).toHaveText('');
            const save=page.getByRole('button',{name:'Save records to test',exact:true}); await expect(save).toBeEnabled(); assert.notEqual(await save.getAttribute('aria-disabled'),'true');
            report.beforeSourceSave={ at:new Date().toISOString(), selectedBinding:await select.inputValue(), selectedLabel, bindingError:await error.innerText(), saveDisabled:await save.isDisabled(), ariaDisabled:await save.getAttribute('aria-disabled'), version:safeVersion(await version()) };
            await screenshot('02-source-selected');
            stage('save-source');
            const responsePromise=page.waitForResponse(response=>response.request().method()==='POST' && new URL(response.url()).pathname===`/procedures/${procedureId}/builder`,{timeout:15000}).then(response=>response,()=>null);
            await save.click(); const response=await responsePromise;
            report.sourceSaveHttpStatus=response?.status()??null;
            if(response) await response.finished();
            await screenshot('03-source-save-result');
            report.sourceSaveVisibleText=redact((await panel.innerText()).slice(0,12000));
            const saved=await poll(version,row=>row?.source_snapshot?.bindingId===bindingId && row.plan_status!=='pending','persisted source_snapshot binding and settled derivation',20000);
            report.sourceSaved=safeVersion(saved);
            await page.reload({waitUntil:'domcontentloaded'}); await expect(page.locator('[data-guided-ready=true]')).toBeVisible();
            const reloaded=await version(); assert.equal(reloaded.source_snapshot?.bindingId,bindingId);
            report.sourceAfterReload=safeVersion(reloaded); await screenshot('04-reloaded');
            report.sourceSaveProven=true; stage('source-save-proven');
          } catch(error) {
            report.failure={ stage:report.stage, name:error?.name??'Error', message:redact(error?.message??error) }; process.exitCode=1;
            if(procedureId) report.persistedAtFailure=safeVersion(await version().catch(()=>null));
            await screenshot('failure').catch(()=>{});
          } finally {
            await browser?.close().catch(()=>{});
            try {
              userId ??= await findUserIdByEmail(db,email);
              if(userId) {
                await sql.begin(async tx=>{ await tx`DELETE FROM auth_session WHERE user_id=${userId}`; await tx`DELETE FROM user_role WHERE user_id=${userId}`; });
                const [row]=await sql`SELECT (SELECT count(*)::int FROM auth_session WHERE user_id=${userId}) AS sessions, (SELECT count(*)::int FROM user_role WHERE user_id=${userId}) AS roles`;
                assert.equal(row.sessions,0); assert.equal(row.roles,0); report.cleanup={auditorId:userId,sessions:row.sessions,roles:row.roles,verified:true};
              } else report.cleanup={identityNotCreated:true,verified:true};
            } catch(error) { report.cleanup={verified:false,error:redact(error?.message??error)}; process.exitCode=1; }
            await sql.end({timeout:5}).catch(()=>{});
            report.finishedAt=new Date().toISOString();
            writeFileSync(`${out}/report.json`,JSON.stringify(report,null,2));
            const manifest=readdirSync(out).map(name=>({name,sha256:sha(readFileSync(`${out}/${name}`))}));
            writeFileSync(`${out}/manifest.json`,JSON.stringify(manifest,null,2));
            console.log('SOURCE_SAVE_DIAGNOSTIC_REPORT',JSON.stringify(report));
          }
          NODE
      - name: Recheck source invariance
        if: always()
        run: git diff --exit-code "$RELEASE_SHA" -- . ':(exclude).github/workflows/**'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-save-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/source-save-proof/
          if-no-files-found: error
          retention-days: 7
