name: LoanCore source UI diagnostic
on:
  push:
    branches: [validation/final-loancore-20260917]
    paths: [.github/workflows/loancore-source-ui-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: loancore-source-ui-diagnostic
  cancel-in-progress: false
env:
  RELEASE_SHA: ef0515efbf0c2c558c5ad0153559d7239a8652d9
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove application source is released
        run: git diff --exit-code "$RELEASE_SHA" HEAD -- . ':(exclude).github/workflows/**'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Assemble bounded diagnostic, not application source
        run: |
          git show 18e2959e425f949e3e425f2702a9e68651aa129e:.github/workflows/loancore-source-ui-diagnostic.yml > /tmp/source-diagnostic-definition.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          definition = Path('/tmp/source-diagnostic-definition.yml').read_text()
          script = textwrap.dedent(definition.split("node --input-type=module <<'NODE'\n", 1)[1].split('\n          NODE', 1)[0])
          replacements = {
              'SELECT id, period, scope, source_snapshot, targets, plan_status': 'SELECT version_id AS id, period, scope, source_snapshot, targets, plan_status',
              "scopePanel.getByRole('button',{name:'Choose dates',exact:true})": '''scopePanel.locator('.ls-guide-questions__nav button[aria-controls$="-period"]')''',
              "panel.getByRole('button',{name:'Choose records',exact:true})": '''panel.locator('.ls-guide-questions__nav button[aria-controls$="-source"]')''',
              "stage('period-scope');": """stage('settle-new-draft');
              await poll(version,row=>row && row.plan_status!=='pending','new draft initial plan derivation settled');
              await page.reload({waitUntil:'domcontentloaded'}); await expect(page.locator('[data-guided-ready=true]')).toBeVisible();
              report.initialSettledVersion=safeVersion(await version());
              stage('period-scope');""",
              'if(response) await response.finished();': """// A streaming server-action response need not finish with the mutation.
              // Its status is diagnostic only. The persisted section is authoritative.
              report.sourceSaveResponseSeenAt=new Date().toISOString();""",
              "if(procedureId) report.persistedAtFailure=safeVersion(await version().catch(()=>null));": """if(procedureId) report.persistedAtFailure=safeVersion(await version().catch(()=>null));
              if(page && procedureId) { report.failureBanners=(await page.locator('.ls-banner').allInnerTexts().catch(()=>[])).map(redact); report.failureVisibleText=redact((await page.locator('body').innerText().catch(()=>''))); }""",
              'fullPage: false': 'fullPage: true',
              "console.log('DIAGNOSTIC_STAGE', name);": "console.log('DIAGNOSTIC_STAGE', name); writeFileSync(`${out}/progress.json`,JSON.stringify(report,null,2));",
          }
          for before, after in replacements.items():
              assert script.count(before) == 1, f'Diagnostic replacement did not match exactly once: {before}'
              script = script.replace(before, after, 1)
          Path('source-save-diagnostic.mjs').write_text(script)
          out = Path('/tmp/source-save-proof'); out.mkdir(exist_ok=True)
          (out / 'executed-harness.mjs').write_text(script)
          PY
          node --check source-save-diagnostic.mjs
          sha256sum source-save-diagnostic.mjs
      - name: Exercise normal authoring controls and require persisted source
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: timeout --signal=TERM --kill-after=10s 180s node source-save-diagnostic.mjs
      - name: Verify cleanup independently even after interruption
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGCONNECT_TIMEOUT: '15'
        run: |
          mkdir -p /tmp/source-save-proof
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v email="source-save-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test" -tA <<'SQL' > /tmp/source-save-proof/independent-cleanup.txt
          BEGIN;
          SET LOCAL statement_timeout = '10s';
          DELETE FROM auth_session WHERE user_id IN (SELECT id FROM auth_user WHERE email=:'email');
          DELETE FROM user_role WHERE user_id IN (SELECT id FROM auth_user WHERE email=:'email');
          SELECT jsonb_build_object('userId',id,'sessions',(SELECT count(*) FROM auth_session WHERE user_id=u.id),'roles',(SELECT count(*) FROM user_role WHERE user_id=u.id)) FROM auth_user u WHERE email=:'email';
          COMMIT;
          SQL
          cat /tmp/source-save-proof/independent-cleanup.txt
      - name: Verify source invariant and archive checksums
        if: always()
        run: |
          git diff --exit-code "$RELEASE_SHA" -- . ':(exclude).github/workflows/**'
          cd /tmp/source-save-proof
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-save-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/source-save-proof/
          if-no-files-found: error
          retention-days: 7
