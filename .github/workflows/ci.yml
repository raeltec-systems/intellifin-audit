name: CI

# AD-12: every pull request must pass type checking, the AD-1 dependency-boundary
# check, unit tests, and Drizzle migrations against a real PostgreSQL 18 service.
# AD-15: this workflow migrates only a throwaway CI database. It never touches an
# environment database — release.yml alone does that.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '11.25.0'

jobs:
  verify:
    name: Typecheck, boundaries, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Dependency boundaries (AD-1)
        run: pnpm boundaries

      - name: Unit tests
        run: pnpm test

  database:
    name: Migrations and integration tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellifin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/intellifin_ci
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the service really is PostgreSQL 18 (AD-11)
        run: |
          major="$(psql "$DATABASE_URL" -tAc "SELECT split_part(current_setting('server_version'), '.', 1)")"
          echo "server_version major: ${major}"
          test "${major}" = "18"

      - name: Apply migrations (throwaway CI database)
        run: pnpm db:migrate

      - name: Fail if migrations are not up to date with the schema
        run: |
          pnpm db:generate
          drift="$(git status --porcelain -- packages/infrastructure/drizzle)"
          if [ -n "$drift" ]; then
            echo "::error::packages/infrastructure/drizzle is out of date. Run 'pnpm db:generate' and commit the migration."
            echo "$drift"
            git --no-pager diff -- packages/infrastructure/drizzle
            exit 1
          fi

      - name: Integration tests
        run: pnpm test:integration

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
