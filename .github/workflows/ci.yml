name: CI

# AD-12: every pull request must pass type checking, the AD-1 dependency-boundary
# check, unit tests, and Drizzle migrations against a real PostgreSQL 18 service.
# AD-15: this workflow migrates only a throwaway CI database. It never touches an
# environment database — release.yml alone does that.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '11.25.0'

jobs:
  verify:
    name: Typecheck, boundaries, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Dependency boundaries (AD-1)
        run: pnpm boundaries

      - name: Unit tests
        run: pnpm test

  database:
    name: Migrations and integration tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The same image the deployed environment runs, presenting the same self-signed
      # certificate. `sslmode=require` below makes CI connect over TLS exactly as the
      # release migration and the running services do; a driver that rejects a chain it
      # cannot verify fails here rather than during a release.
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellifin_ci
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/intellifin_ci?sslmode=require
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack and pin pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the service really is PostgreSQL 18 (AD-11)
        run: |
          major="$(psql "$DATABASE_URL" -tAc "SELECT split_part(current_setting('server_version'), '.', 1)")"
          echo "server_version major: ${major}"
          test "${major}" = "18"

      - name: Apply migrations (throwaway CI database)
        run: pnpm db:migrate

      - name: Fail if migrations are not up to date with the schema
        run: |
          # </dev/null: drizzle-kit prompts on an ambiguous diff. On a runner with no
          # tty that would hang until the job timeout instead of failing.
          pnpm db:generate < /dev/null
          drift="$(git status --porcelain -- packages/infrastructure/drizzle)"
          if [ -n "$drift" ]; then
            echo "::error::packages/infrastructure/drizzle is out of date. Run 'pnpm db:generate' and commit the migration."
            echo "$drift"
            git --no-pager diff -- packages/infrastructure/drizzle
            exit 1
          fi

      - name: Integration tests
        run: pnpm test:integration

  images:
    name: Container images build and refuse to start unmigrated
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: intellifin-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          load: true
          tags: intellifin-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # AD-15: neither image may migrate, and neither may pretend to be healthy
      # against a database it cannot reach. Point both at an unreachable address.
      - name: Web answers 503 on /api/health when the database is unreachable
        run: |
          set -euo pipefail
          docker run -d --name web-smoke -p 3000:3000 \
            -e DATABASE_URL='postgres://x:y@127.0.0.1:1/z' \
            -e SERVICE_NAME=web \
            -e BETTER_AUTH_SECRET='ci-smoke-secret-at-least-32-characters-long' \
            `# https, not http: the image runs with NODE_ENV=production, where a` \
            `# plain-http origin is refused because the session cookie would not` \
            `# be Secure. Nothing here signs in, so the host need not resolve.` \
            -e BETTER_AUTH_URL='https://web-smoke.invalid' \
            intellifin-web:ci

          code=000
          for _ in $(seq 1 60); do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3000/api/health || echo 000)"
            if [ "$code" = "503" ]; then break; fi
            sleep 1
          done

          echo "status=${code}"
          cat /tmp/health.json || true
          docker logs web-smoke || true

          if [ "$code" != "503" ]; then
            docker rm -f web-smoke >/dev/null 2>&1 || true
            echo "::error::web did not answer 503 on /api/health within 60s (got ${code})"
            exit 1
          fi

      # FR-1: default-deny is a shipped file (middleware.ts), not a unit-test fixture.
      # /api/health is on the public allowlist, so the check above passes just as well
      # with no route protection at all. These two ask the running image directly.
      - name: Protected routes are refused in the built image
        run: |
          set -euo pipefail
          api="$(curl -s -o /tmp/session.out -w '%{http_code}' http://127.0.0.1:3000/api/session)"
          page="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)"
          echo "GET /api/session -> ${api} ; GET / -> ${page}"

          if [ "$api" != "401" ]; then
            echo "::error::GET /api/session returned ${api}, expected 401 for an unauthenticated caller"
            docker logs web-smoke || true
            exit 1
          fi
          if [ -s /tmp/session.out ]; then
            echo "::error::GET /api/session returned a body; an unauthenticated refusal must disclose nothing"
            cat /tmp/session.out
            exit 1
          fi
          if [ "$page" != "307" ]; then
            echo "::error::GET / returned ${page}, expected a 307 redirect to /sign-in"
            docker logs web-smoke || true
            exit 1
          fi

      - name: Stop the web smoke container
        if: always()
        run: docker rm -f web-smoke >/dev/null 2>&1 || true

      - name: Worker exits non-zero and refuses to start when the database is unreachable
        run: |
          set -euo pipefail
          set +e
          docker run --name worker-smoke \
            -e DATABASE_URL='postgres://x:y@127.0.0.1:1/z' \
            -e SERVICE_NAME=worker \
            intellifin-worker:ci > /tmp/worker.out 2> /tmp/worker.err
          status=$?
          set -e

          echo "exit status: ${status}"
          echo "--- stdout ---"; cat /tmp/worker.out || true
          echo "--- stderr ---"; cat /tmp/worker.err || true
          docker rm -f worker-smoke >/dev/null 2>&1 || true

          if [ "$status" -eq 0 ]; then
            echo "::error::worker exited 0 against an unreachable database; it must refuse to start"
            exit 1
          fi
          if ! grep -q 'Refusing to start' /tmp/worker.err; then
            echo "::error::worker stderr did not contain 'Refusing to start'"
            exit 1
          fi
