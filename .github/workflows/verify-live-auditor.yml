name: Verify deployed auditor journey

# One user-authorized live check. No deployment, migration, model mocks, or Run DB writes.
# Remove the push trigger after evidence has been collected.
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-live-auditor.yml]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deployed-auditor-verification
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Enable pinned pnpm before setup-node cache discovery
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install pinned workspace tooling
        run: pnpm install --frozen-lockfile
      - name: Retain safe preflight categories and mask provider identity in screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-live-auditor.mjs')
          s = p.read_text()
          old = "  if (!original || !['INCONCLUSIVE', 'RUN_FAILED', 'CANCELED'].includes(original.state))"
          assert old in s
          s = s.replace(old, "  emit('predecessor-read', { found: !!original, state: original?.state ?? null });\n" + old)
          old = "  walk(version?.compiledPlan);"
          assert old in s
          s = s.replace(old, old + "\n  emit('target-preflight-read', { versionFound: !!version, planFound: !!version?.compiledPlan, targetHosts: origins.map(origin => new URL(origin).hostname) });")
          old = "name: error?.name || 'Error', stage:"
          assert old in s
          s = s.replace(old, "name: error?.name || 'Error', code: ['Predecessor is not a stopped Run', 'Target safety preflight refused', 'Created user could not be found', 'New Run acknowledgement missing', 'Created Run disappeared', 'Run attribution mismatch', 'Watch destination mismatch'].includes(error?.message) ? error.message : 'Unclassified', stage:")
          s = s.replace("mask: [p.locator('input[type=\"password\"]')]", "mask: [p.locator('input[type=\"password\"]'), p.locator('.ls-session__workspace')]")
          p.write_text(s)
          PY
      - name: Validate browser script and build administrative identity dependencies
        run: |
          node --check scripts/verify-live-auditor.mjs
          pnpm --filter '@intellifin/infrastructure...' build
          pnpm exec playwright install --with-deps chromium
      - name: Sign in, start exactly one live Run, observe Watch and Replay
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/verify-live-auditor.mjs
      - name: Retain synthetic UI evidence without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-auditor-journey-${{ github.run_id }}
          path: live-auditor-evidence/
          if-no-files-found: warn
          retention-days: 14
