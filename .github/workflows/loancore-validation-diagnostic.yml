name: LoanCore validation diagnostic

on:
  push:
    branches: [validation/final-loancore-20260917]
    paths: [.github/workflows/loancore-validation-diagnostic.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@intellifin/infrastructure...' build
      - name: Inspect persisted current acceptance draft
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { createSqlClient } from '@intellifin/infrastructure';
          const sql = createSqlClient(process.env.DATABASE_URL, { max: 1 });
          const procedureId = '01a0b0de-d119-71e7-85da-6abb2869318f';
          try {
            const versions = await sql`
              SELECT version_id, version_number, state, plan_status, plan_failure_reason,
                     plan_attempts,
                     to_jsonb(procedure_version) - 'compiled_plan' - 'submitted_review' - 'frozen_review' AS persisted
              FROM procedure_version
              WHERE procedure_id = ${procedureId}::uuid
              ORDER BY version_number DESC
            `;
            const versionIds = versions.map(v => String(v.version_id));
            const jobs = versionIds.length === 0 ? [] : await sql`
              SELECT id, state, started_on, completed_on, output, data
              FROM pgboss.job
              WHERE name = 'procedures' AND data->>'versionId' = ANY(${versionIds})
              ORDER BY created_on DESC
            `;
            const safeJobs = jobs.map(j => ({ id: String(j.id), state: j.state, started_on: j.started_on, completed_on: j.completed_on, output: j.output, versionId: j.data?.versionId ?? null }));
            console.log('DIAGNOSTIC', JSON.stringify({ procedureId, versions, jobs: safeJobs }, null, 2));
          } finally {
            await sql.end({ timeout: 5 });
          }
          NODE
