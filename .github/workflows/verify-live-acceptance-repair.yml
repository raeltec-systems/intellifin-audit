name: Verify live acceptance repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-live-acceptance-repair.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellifin_e2e
          PGDATA: /var/lib/postgresql/data/pgdata
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/intellifin_e2e?sslmode=require
      SERVICE_NAME: web
      BETTER_AUTH_SECRET: ci-e2e-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      E2E_AUDITOR_EMAIL: auditor@example.test
      E2E_ADMIN_EMAIL: administrator@example.test
      E2E_PASSWORD: ci-e2e-password-not-a-real-credential
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: python3 .github/scripts/live-acceptance-repair.py
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, boundaries and unit regressions
        run: |
          pnpm typecheck
          pnpm boundaries
          pnpm test
      - name: Build and prepare disposable database
        run: |
          pnpm build
          pnpm db:migrate
          SEED_PASSWORD="$E2E_PASSWORD" pnpm seed:identity --email "$E2E_AUDITOR_EMAIL" --name 'CI Auditor' --role auditor
          SEED_PASSWORD="$E2E_PASSWORD" pnpm seed:identity --email "$E2E_ADMIN_EMAIL" --name 'CI Administrator' --role poc-administrator
          pnpm exec playwright install --with-deps chromium
      - name: Real browser Live View and Replay regressions
        run: pnpm exec playwright test tests/e2e/live-view.spec.ts tests/e2e/replay.spec.ts
      - name: Retain the exact tested patch
        run: |
          git diff --check
          git diff --binary > /tmp/verified.patch
          git rev-parse HEAD > /tmp/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-acceptance-repair-evidence
          path: |
            /tmp/verified.patch
            /tmp/base.txt
            test-results/
            playwright-report/
          retention-days: 7
  candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: live-acceptance-repair-evidence
          path: /tmp/verified
      - name: Restore tested files
        run: |
          patch=$(find /tmp/verified -name verified.patch -print -quit)
          base=$(find /tmp/verified -name base.txt -print -quit)
          test "$(cat "$base")" = "$GITHUB_SHA"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
      - name: Publish atomic verified Git objects without moving main
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs'), cp = require('node:child_process');
            const {owner, repo} = context.repo;
            const current = await github.rest.git.getRef({owner, repo, ref:'heads/main'});
            if (current.data.object.sha !== context.sha) throw new Error('Main advanced; reconcile before publishing.');
            for (const path of ['.github/scripts/live-acceptance-repair.py','.github/workflows/verify-live-acceptance-repair.yml','.github/workflows/export-repair-source.yml']) fs.unlinkSync(path);
            cp.execFileSync('git',['add','--all']);
            const paths = cp.execFileSync('git',['diff','--cached','--name-only','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
            let parent=context.sha;
            const commits=[];
            for (const [message, selected] of [
              ['test: verify safe workspace references without exposing provider handles',paths.filter(p=>p==='tests/e2e/live-view.spec.ts')],
              ['test: publish a separate valid three-record LoanCore population',paths.filter(p=>p!=='tests/e2e/live-view.spec.ts')]
            ]) {
              const entries=[];
              for (const path of selected) {
                if (!fs.existsSync(path)) { entries.push({path,mode:'100644',type:'blob',sha:null}); continue; }
                const b=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(path).toString('base64'),encoding:'base64'});
                entries.push({path,mode:'100644',type:'blob',sha:b.data.sha});
              }
              const prev=await github.rest.git.getCommit({owner,repo,commit_sha:parent});
              const tree=await github.rest.git.createTree({owner,repo,base_tree:prev.data.tree.sha,tree:entries});
              const commit=await github.rest.git.createCommit({owner,repo,message,tree:tree.data.sha,parents:[parent]});
              parent=commit.data.sha; commits.push({sha:parent,message,paths:selected});
            }
            const receipt={base:context.sha,candidate:parent,commits,verificationRun:context.runId};
            fs.writeFileSync('/tmp/candidate.json',JSON.stringify(receipt,null,2));
            console.log(JSON.stringify(receipt));
      - uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-repair-receipt
          path: /tmp/candidate.json
          retention-days: 7
