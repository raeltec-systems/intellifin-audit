name: Final acceptance plan diagnostic
on:
  push:
    branches: [validation/final-loancore-20260917]
    paths: [.github/workflows/validation-plan-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@intellifin/infrastructure...' build
      - name: Read only the corrected acceptance draft progress
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { createSqlClient } from '@intellifin/infrastructure';
          const sql = createSqlClient(process.env.DATABASE_URL, { max: 1 });
          const versions = await sql`
            SELECT version_id::text, state, period, scope,
                   source_snapshot IS NOT NULL AS has_source,
                   jsonb_array_length(targets) AS targets,
                   jsonb_array_length(instructions) AS instructions,
                   schedule IS NOT NULL AS has_schedule,
                   plan_status, plan_failure_reason, plan_derivable,
                   section_preparation, updated_at
            FROM procedure_version
            WHERE procedure_id = '01a0b0ba-49e6-70b0-8cbc-dbaa91d5b313'::uuid
            ORDER BY created_at DESC
          `;
          const ids = versions.map(row => row.version_id);
          const runs = ids.length === 0 ? [] : await sql`
            SELECT run_id::text, state, version_id::text FROM audit_run WHERE version_id::text = ANY(${ids})
          `;
          console.log('PLAN_DIAGNOSTIC', JSON.stringify({ versions, runs }));
          await sql.end({ timeout: 5 });
          NODE
