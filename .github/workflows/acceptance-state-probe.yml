name: Acceptance state probe

# Read-only. Reports what the in-flight acceptance has actually written, so a long
# acceptance step can be diagnosed from facts rather than from its silence. It writes
# nothing and takes no lock.
on:
  push:
    branches: [claude/relaxed-rubin-stwsfu]
    paths: [.github/workflows/acceptance-state-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@intellifin/infrastructure...' build
      - name: Report the acceptance Runs and their stages
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createSqlClient } from '@intellifin/infrastructure';
          const sql = createSqlClient(process.env.DATABASE_URL, { max: 1 });
          try {
            const procedures = await sql`
              SELECT procedure_id, control_name, created_at FROM procedure
              WHERE control_name LIKE 'Live LoanCore acceptance %'
                 OR control_name LIKE 'Negative LoanCore acceptance %'
              ORDER BY created_at DESC LIMIT 3`;
            const runs = await sql`
              SELECT r.run_id, r.state, r.initiated_at, p.control_name,
                (SELECT status FROM population_execution x WHERE x.run_id = r.run_id) AS pop_status,
                (SELECT diagnostic FROM population_execution x WHERE x.run_id = r.run_id) AS pop_diag,
                (SELECT status FROM run_agent_execution a WHERE a.run_id = r.run_id) AS agent_status,
                (SELECT diagnostic FROM run_agent_execution a WHERE a.run_id = r.run_id) AS agent_diag,
                (SELECT status FROM run_workspace w WHERE w.run_id = r.run_id) AS ws_status,
                (SELECT mode FROM run_workspace w WHERE w.run_id = r.run_id) AS ws_mode,
                (SELECT count(*)::int FROM run_work_item i WHERE i.run_id = r.run_id) AS work_items,
                (SELECT count(*)::int FROM run_observation o WHERE o.run_id = r.run_id) AS observations,
                (SELECT count(*)::int FROM run_tool_action t WHERE t.run_id = r.run_id) AS tool_actions,
                (SELECT count(*)::int FROM run_evidence e WHERE e.run_id = r.run_id AND e.kind='screenshot' AND e.state='REGISTERED') AS frames,
                (SELECT outcome FROM run_result s WHERE s.run_id = r.run_id) AS outcome
              FROM audit_run r JOIN procedure p ON p.procedure_id = r.procedure_id
              WHERE p.procedure_id = ANY(${procedures.map(row => String(row.procedure_id))}::uuid[])
              ORDER BY r.initiated_at`;
            const items = runs.length === 0 ? [] : await sql`
              SELECT run_id, subject_key, state, observations, diagnostic, attempts
              FROM run_work_item WHERE run_id = ANY(${runs.map(r => String(r.run_id))}::uuid[])
              ORDER BY run_id, ordinal`;
            // Print what is already known before asking anything else. A later query that
            // names a column wrongly must not take the whole report with it — which is
            // exactly what happened to the first version of this probe.
            const versions = procedures.length === 0 ? [] : await sql`
              SELECT version_id, version_number, state, plan_status, plan_failure_reason,
                     updated_at,
                     (period IS NOT NULL) AS has_period, (scope <> '') AS has_scope,
                     (source_snapshot IS NOT NULL) AS has_source,
                     jsonb_array_length(targets) AS targets,
                     jsonb_array_length(instructions) AS instructions,
                     (schedule IS NOT NULL) AS has_schedule,
                     jsonb_array_length(plan_attempts) AS attempts,
                     (section_preparation IS NOT NULL) AS has_preparation
              FROM procedure_version
              WHERE procedure_id = ANY(${procedures.map(row => String(row.procedure_id))}::uuid[])
              ORDER BY version_number`;
            console.log('PROBE', JSON.stringify({ now: new Date().toISOString(), procedures, versions, runs, items }, null, 2));
            // Each query catches its own failure and says so in place. A probe that loses
            // its findings to one wrong column name costs a cycle and reports nothing —
            // which this one already did twice, on `observed_at` and then on `stage`.
            const ids = runs.map(r => String(r.run_id));
            const safely = (promise) => promise.then(rows => rows, error => [{ unavailable: String(error?.code ?? 'error'), detail: String(error?.message ?? '').slice(0, 120) }]);
            const actions = ids.length === 0 ? [] : await safely(sql`
              SELECT run_id, action, method, outcome, status, redirected, capture, denial, diagnostic,
                     regexp_replace(destination, '^(https?://[^/]+).*$', '\\1') AS origin
              FROM run_tool_action WHERE run_id = ANY(${ids}::uuid[]) ORDER BY started_at`);
            const waits = ids.length === 0 ? [] : await safely(sql`
              SELECT run_id, kind, opened_at, closed_at, closure_kind, options FROM run_wait
              WHERE run_id = ANY(${ids}::uuid[]) ORDER BY opened_at`);
            const evidence = ids.length === 0 ? [] : await safely(sql`
              SELECT run_id, kind, state, count(*)::int AS count, min(size) AS min_size, max(size) AS max_size
              FROM run_evidence WHERE run_id = ANY(${ids}::uuid[])
              GROUP BY run_id, kind, state ORDER BY run_id, kind`);
            const steps = ids.length === 0 ? [] : await safely(sql`
              SELECT run_id, action, state, attempts, diagnostic FROM run_session_step
              WHERE run_id = ANY(${ids}::uuid[]) ORDER BY run_id`);
            console.log('PROBE_RUN', JSON.stringify({ actions, waits, evidence, steps }, null, 2));
            const beat = await sql`SELECT hostname, seen_at FROM worker_heartbeat ORDER BY seen_at DESC LIMIT 3`
              .catch(error => [{ unavailable: String(error?.code ?? 'error') }]);
            const jobs = await sql`
              SELECT name, state, count(*)::int AS count FROM pgboss.job
              WHERE created_on > now() - interval '90 minutes' GROUP BY name, state ORDER BY name, state`
              .catch(error => [{ unavailable: String(error?.code ?? 'error') }]);
            console.log('PROBE_WORKER', JSON.stringify({ heartbeat: beat, jobs }, null, 2));
          } finally { await sql.end({ timeout: 5 }); }
          NODE
