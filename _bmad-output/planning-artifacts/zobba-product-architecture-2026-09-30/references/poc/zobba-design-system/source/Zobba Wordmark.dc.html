<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display: inline-flex; align-items: center; line-height: 0;"><img src="{{ src }}" alt="Zobba" style="display: block; height: {{ h }}; width: auto;"></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:120},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;},&quot;mark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;endorse&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const size = parseFloat(this.props.size) || 40;
    const dark = !!this.props.dark;
    const noMark = this.props.mark === false || this.props.mark === 'false';
    const base = this.props.base || '../assets/';
    let f;
    if (this.props.lower) f = 'reference/zobba-wordmark-lowercase-reference.svg';
    else if (this.props.plain) f = 'reference/zobba-wordmark-unstepped-reference.svg';
    else if (noMark) f = dark ? 'wordmark/zobba-wordmark-reverse.svg' : 'wordmark/zobba-wordmark-graphite.svg';
    else if (this.props.endorse) f = dark ? 'lockup/zobba-lockup-endorsed-reverse.svg' : 'lockup/zobba-lockup-endorsed-color.svg';
    else f = dark ? 'lockup/zobba-lockup-reverse.svg' : 'lockup/zobba-lockup-color.svg';
    return { src: base + f + '?v=2', h: (size * 0.726).toFixed(1) + 'px' };
  }
}
</script>
</body>
</html>
