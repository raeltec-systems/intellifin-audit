[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/api", "crates/worker", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
zobba-domain = { path = "crates/domain" }
zobba-application = { path = "crates/application" }
zobba-infrastructure = { path = "crates/infrastructure" }
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "migrate", "macros"] }
utoipa = "=5.4.0"
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
